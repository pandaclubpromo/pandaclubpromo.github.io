backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "Achadinhos & Produtos"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título do Produto", name: "title", widget: "string" }
      - { label: "Categoria", name: "category", widget: "string" }
      - { label: "Descrição Curta", name: "description", widget: "text" }
      - { label: "Link de Afiliado (Mercado Livre)", name: "link", widget: "string" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Descrição Completa (Detalhes)", name: "body", widget: "markdown", required: false }
